<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías</title>

    <link rel="stylesheet" href="../../shared/styles/shared.css">
    <link rel="stylesheet" href="../../shared/styles/Categoria.css">
</head>
<body>

    <aside>
        <div class="perfil">
            <img src="../../shared/images/USER1.png" alt="Usuario">
            <p id="nombre-usuario-actual">user1</p>
        </div>
        <nav>
            <ul>
                <li><a href="../../pages/admin/inicio.html">🏠 Inicio</a></li>
                <li><a href="../../pages/categorias/Categoria.html" class="active">📁 Categorías</a></li>
                <li><a href="../../pages/platillos/Platillo.html">🍔 Platillos</a></li>
                <li><a href="../../pages/mesas/Mesas.html">🪑 Mesas</a></li>
                <li><a href="../../pages/personal/personal.html">👥 Personal</a></li>
                <li><a href="../../pages/cocina/cocina.html">🍳 Cocina</a></li>
                <li><a href="../../pages/facturas/Factura.html">📄 Facturas</a></li>
                <li><a href="../../pages/Rol/Roles.html">🔐 Roles</a></li>
                <li><a href="../../pages/admin/generar-qr.html">📱 Generar QR</a></li>
            </ul>
        </nav>
    </aside>

    <main>

        <header>
            <h1>Categorías</h1>
        </header>

        <div class="herramientas">
            <button id="btn-agregar-platillo" class="btn-primary" title="Agregar Categoría">+</button>

            <div class="input-busqueda">
                <span>🔍</span>
                <input type="text" id="input-buscar-categoria" placeholder="Buscar...">
            </div>
        </div>

        <table id="tabla-categorias">
            <thead>
                <tr>
                    <th>N°</th>
                    <th>Nombre</th>
                    <th style="text-align: right; padding-right: 30px;">Acciones</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>

        <div class="paginacion">
            <button id="btn-prev">Anterior</button>
            <span id="info-pagina">Página 1 de 1</span>
            <button id="btn-next">Siguiente</button>
        </div>
    </main>

    <div class="modal-overlay" id="modal-categoria" style="display: none;">
        <div class="modal-content">
            
            <header class="modal-header">
                <h3>Gestión de Categoría</h3>
            </header>

            <main class="modal-body">
                <form id="form-categoria">
                    <div class="fila-formulario">
                        <div class="campo">
                            <label for="categoria-id">Categoría ID</label>
                            <input type="text" id="categoria-id" name="categoriaID" placeholder="Nuevo (Auto)" readonly class="input-readonly">
                        </div>
                    </div>

                    <div class="fila-formulario">
                        <div class="campo">
                            <label for="nombre-categoria">Nombre de la Categoría</label>
                            <input type="text" id="nombre-categoria" name="nombre" placeholder="Ej: Hamburguesas, Bebidas Naturales" required maxlength="100">
                        </div>
                    </div>
                </form>
            </main>

            <footer class="botones-acciones">
                <button type="submit" form="form-categoria" class="btn-guardar">Guardar</button>
                <button type="button" class="btn-salir">Salir</button>
            </footer>

        </div>
    </div>

    <script type="module" src="./categoriaController.js"></script>

</body>
</html>
