<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal - Rancho de la Mimi</title>
    <link rel="stylesheet" href="../../shared/styles/shared.css">
    <link rel="stylesheet" href="../../shared/styles/personal.css">
</head>

<body>
    <!-- 🔴 MENÚ LATERAL -->
    <aside>
        <div class="perfil">
            <img src="../../shared/images/USER1.png" alt="Usuario">
            <p id="nombre-usuario-actual">user1</p>
        </div>
 
        <nav>
            <ul>
                <li><a href="../../pages/admin/inicio.html">🏠 Inicio</a></li>
                <li><a href="../../pages/categorias/Categoria.html">📁 Categorías</a></li>
                <li><a href="../../pages/platillos/Platillo.html">🍔 Platillos</a></li>
                <li><a href="../../pages/mesas/Mesas.html">🪑 Mesas</a></li>
                <li><a href="../../pages/personal/personal.html" class="active">👥 Personal</a></li>
                <li><a href="../../pages/cocina/cocina.html">🍳 Cocina</a></li>
                <li><a href="../../pages/facturas/Factura.html">📄 Facturas</a></li>
                <li><a href="../../pages/Rol/Roles.html">🔐 Roles</a></li>
                <li><a href="../../pages/admin/generar-qr.html">📱 Generar QR</a></li>
            </ul>
        </nav>
    </aside>

    <!-- 🟢 CONTENIDO -->
    <main>
        <header>
            <h1>Lista de Personal</h1>
        </header>

        <!-- HERRAMIENTAS -->
        <div class="herramientas">
            <button id="btn-abrir-agregar" class="btn-agregar-top" title="Agregar Personal">+</button>

            <label class="lbl-mostrar-inactivos" style="display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; color: #555; user-select: none; margin-left: 10px; margin-right: 10px;">
                <input type="checkbox" id="chk-mostrar-inactivos" style="cursor: pointer;">
                Mostrar desactivados
            </label>

            <div class="input-busqueda">
                🔍 <input type="text" id="input-buscar-personal" placeholder="Buscar por nombre...">
            </div>
        </div>

        <!-- TABLA -->
        <div class="tabla-container">
            <table id="tabla-personal">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre Completo</th>
                        <th>Usuario</th>
                        <th>Teléfono</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-personal-body">
                    <tr>
                        <td colspan="7" style="text-align: center;">Cargando personal...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="paginacion">
            <button id="btn-prev" disabled>Anterior</button>
            <span id="info-pagina">Página 1 de 1</span>
            <button id="btn-next" disabled>Siguiente</button>
        </div>
    </main>

    <!-- MODAL AGREGAR/EDITAR PERSONAL -->
    <div class="modal-overlay" id="modal-personal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header-estandar">
                <h3 id="modal-titulo-personal">👥 Registrar Nuevo Personal</h3>
            </div>
            <div class="modal-body">
                <form id="form-personal">
                    <input type="hidden" id="usuario-id" value="">

                    <div class="campo">
                        <label>Nombre Completo:</label>
                        <input type="text" id="per-nombre" placeholder="Ej: Juan Pérez" required>
                    </div>

                    <div class="campo">
                        <label>Nombre de Usuario (Login):</label>
                        <input type="text" id="per-usuario" placeholder="Ej: juan.perez" required>
                    </div>

                    <div class="campo">
                        <label>Teléfono:</label>
                        <input type="text" id="per-telefono" placeholder="Ej: 8888-8888">
                    </div>

                    <div class="campo" id="campo-password">
                        <label>Contraseña:</label>
                        <input type="password" id="per-pass" placeholder="********">
                        <small style="color: #666; font-size: 12px;" id="pass-help">Mínimo 6 caracteres</small>
                    </div>

                    <div class="campo">
                        <label>Asignar Rol:</label>
                        <select id="per-rol" required>
                            <option value="">-- Seleccione un Rol --</option>
                        </select>
                    </div>

                    <div class="campo" id="campo-estado" style="display: none;">
                        <label>Estado:</label>
                        <select id="per-estado">
                            <option value="true">Activo</option>
                            <option value="false">Inactivo</option>
                        </select>
                    </div>

                    <div class="botones-acciones">
                        <button type="button" class="btn-salir" id="btn-cancelar">Cancelar</button>
                        <button type="submit" class="btn-guardar" id="btn-guardar-personal">Guardar Personal</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="./personal.js"></script>
</body>
</html>
