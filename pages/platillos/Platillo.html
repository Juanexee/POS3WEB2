<!-- pages/platillos/Platillo.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Restaurante - Platillos</title>
    
    <!-- ⚠️ CORREGIDO: La ruta del CSS -->
    <link rel="stylesheet" href="../../shared/styles/shared.css">
    <link rel="stylesheet" href="../../shared/styles/style.css">
    <link rel="stylesheet" href="../../shared/styles/platillo.css">
</head>
<body>
    <aside>
        <div class="perfil">
            <img src="../../shared/images/USER1.png" alt="Usuario">
            <p id="nombre-usuario-actual">user1</p>
        </div>
        <nav>
            <ul>
                <li><a href="../../pages/admin/inicio.html">🏠 Inicio</a></li>
                <li><a href="../../pages/categorias/Categoria.html">📁 Categorías</a></li>
                <li><a href="../../pages/platillos/Platillo.html" class="active">🍔 Platillos</a></li>
                <li><a href="../../pages/mesas/Mesas.html">🪑 Mesas</a></li>
                <li><a href="../../pages/personal/personal.html">👥 Personal</a></li>
                <li><a href="../../pages/cocina/cocina.html">🍳 Cocina</a></li>
                <li><a href="../../pages/facturas/Factura.html">📄 Facturas</a></li>
                <li><a href="../../pages/Rol/Roles.html">🔐 Roles</a></li>
                <li><a href="../../pages/admin/generar-qr.html">📱 Generar QR</a></li>
            </ul>
        </nav>
    </aside>

    <main>
        <section id="modulo-platillos">
            <header>
                <h1>Lista de Platillos</h1>
                <div class="herramientas">
                    <button id="btn-agregar-platillo" class="btn-primary" title="Agregar Platillo">+</button>
                    <label class="lbl-mostrar-inactivos" style="display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; color: #555; user-select: none; margin-left: 10px; margin-right: 10px;">
                        <input type="checkbox" id="chk-mostrar-inactivos" style="cursor: pointer;">
                        Mostrar agotados
                    </label>
                    <div class="input-busqueda">
                        🔍 <input type="text" id="input-buscar-platillo" placeholder="Buscar platillo...">
                    </div>
                </div>
            </header>

            <table>
                <thead>
                    <tr>
                        <th>N°</th>
                        <th>Platillo</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla-platillos">
                    <!-- Los datos se cargan dinámicamente -->
                </tbody>
            </table>
        </section>

        <!-- Modal para agregar/editar platillo -->
        <div class="modal-overlay" id="modal-platillo" style="display: none;">
            <div class="modal-content">
                <header class="modal-header">
                    <h3>Gestión de Platillo</h3>
                </header>

                <div class="modal-body">
                    <form id="form-platillo">
                        <input type="hidden" id="platillo-id" value="">

                        <div class="fila-formulario">
                            <div class="campo">
                                <label for="nombre-platillo">Nombre del Platillo</label>
                                <input type="text" id="nombre-platillo" name="nombre" placeholder="Ej: Hamburguesa Suprema" required>
                            </div>
                            <div class="campo">
                                <label for="precio-platillo">Precio (C$)</label>
                                <input type="number" id="precio-platillo" name="precio" placeholder="0.00" step="0.01" required>
                            </div>
                        </div>

                        <div class="fila-formulario">
                            <div class="campo">
                                <label for="descripcion-platillo">Descripción</label>
                                <input type="text" id="descripcion-platillo" name="descripcion" placeholder="Ej: Con papas fritas y salsa BBQ...">
                            </div>
                            <div class="campo">
                                <label for="categoria-platillo">Categoría</label>
                                <select id="categoria-platillo" name="categoriaID" required>
                                    <option value="">-- Seleccione --</option>
                                </select>
                            </div>
                        </div>

                        <div class="fila-formulario">
                            <div class="campo">
                                <label for="imagen-platillo">Imagen del Platillo</label>
                                <input type="file" id="imagen-platillo" accept="image/*">
                            </div>
                            <div class="campo" style="display: flex; align-items: center; justify-content: center; min-height: 90px;">
                                <img id="vista-previa-platillo" src="" alt="Vista previa" style="max-height: 80px; max-width: 120px; border-radius: 4px; display: none; margin-top: 10px; border: 1px solid #ddd;">
                            </div>
                        </div>

                        <div class="botones-acciones">
                            <button type="button" class="btn-salir" id="btn-cancelar">Cancelar</button>
                            <button type="submit" class="btn-guardar">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="./platillos.js"></script>
</body>
</html>
