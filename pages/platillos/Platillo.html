<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Restaurante - Platillos</title>
    <link rel="stylesheet" href="../../shared/styles/style.css">
    <link rel="stylesheet" href="../../shared/styles/platillos.css">
</head>
<body>
    <aside>
        <div class="perfil">
            <img src="../../shared/images/USER1.png" alt="Usuario">
            <p>user1</p>
        </div>
        <nav>
           <ul>
                <li><a href="../../pages/admin/inicio.html">🏠Inicio</a></li>
                <li><a href="../../pages/categorias/Categoria.html">📁 Categorías</a></li>
                <li><a href="../../pages/platillos/Platillo.html" class="active">🍔 Platillos</a></li>
                <li><a href="../../pages/mesas/Mesas.html">🪑 Mesas</a></li>
                <li><a href="../../pages/personal/Personal.html">👥 Personal</a></li>
                <li><a href="../../pages/cocina/Cocina.html">🍳 Cocina</a></li>
                <li><a href="../../pages/facturas/Factura.html">📄 Facturas</a></li>
                <li><a href="../../pages/Rol/Roles.html">🔐 Roles</a></li>
            </ul>

        </nav>
    </aside>

    <main>
       <main>
        <section id="modulo-platillos">
            <header>
                <h1>Lista de Platillos</h1>
                <div class="herramientas">
                    <button id="btn-agregar-platillo" class="btn-primary" title="Agregar Platillo">+</button>
                    <div class="input-busqueda">
                        🔍 <input type="text" id="input-buscar-platillo" placeholder="Buscar platillo...">
                    </div>
                </div>
            </header>

            <table>
                <thead>
                    <tr>
                        <th>N°</th>
                        <th>Platillo</th>
                        <th>Descripción</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla-platillos">
                    </tbody>
            </table>
        </section>

        <div class="modal-overlay" id="modal-platillo" style="display: none;">
            <div class="modal-content">
                <header class="modal-header">
                    <div class="logo-circular">
                        <img src="../../shared/images/logo.png" alt="Logo">
                    </div>
                    <h3>Gestión de Platillo</h3>
                </header>

                <main class="modal-body">
                    <form id="form-platillo">
                        <div class="fila-formulario">
                            <div class="campo">
                                <label for="platillo-id">Platillo ID</label>
                                <input type="text" id="platillo-id" name="platilloId" placeholder="Nuevo (Auto)" readonly class="input-readonly">
                            </div>
                        </div>

                        <div class="fila-formulario">
                            <div class="campo">
                                <label for="nombre-platillo">Nombre del Platillo</label>
                                <input type="text" id="nombre-platillo" name="nombre" placeholder="Ej: Hamburguesa Suprema" required maxlength="100">
                            </div>
                            <div class="campo">
                                <label for="precio-platillo">Precio (C$)</label>
                                <input type="number" id="precio-platillo" name="precio" placeholder="0.00" step="0.01" required min="0.01">
                            </div>
                        </div>

                        <div class="fila-formulario">
                            <div class="campo">
                                <label for="Descripcion-platillo">Descripción</label>
                                <input type="text" id="Descripcion-platillo" name="descripcion" placeholder="Ej: Con papas fritas y salsa BBQ..." required>
                            </div>
                        </div>
    </main>

    <script type="module" src="js/platillos.js"></script>
</body>
</html>
