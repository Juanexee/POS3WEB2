<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - El Rancho de la Mimi</title>
    
    <link rel="stylesheet" href="../../shared/styles/login.css">
</head>
<body class="login-body-bg">

    <div class="login-wrapper">
        <div class="login-card">
            
            <div class="login-header">
                <div class="logo-container">
                    <img src="../../assets/images/mimi2.png" alt="Logo La Mimi">
                </div>
                <h1>Bienvenido</h1>
                <p>Ingresa tus credenciales para acceder al sistema</p>
            </div>

            <form id="form-login">
                <div class="input-group">
                    <label for="nombreUsuario">Usuario</label>
                    <input type="text" id="nombreUsuario" name="nombreUsuario" placeholder="Ej: admin" required>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-get-started">Iniciar Sesión</button>

                <div class="login-extra">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
            </form>

        </div>
    </div>

    <script type="module" src="./login.js"></script>
</body>
</html>
